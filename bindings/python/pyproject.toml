[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qules"
dynamic = ["version"]
description = "Python binding for the QULES black-box optimizer native bundle (ctypes, no dependencies)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[tool.setuptools]
packages = ["qules"]

[tool.setuptools.dynamic]
version = { attr = "qules.__version__" }

# pytest's default fd-level capture replaces the process's stdout/stderr file
# descriptors, which crashes the embedded Julia runtime during init_julia.
[tool.pytest.ini_options]
addopts = "--capture=sys"
