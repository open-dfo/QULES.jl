name: Wheels

on:
  push:
    branches: [multiplatform]
  workflow_dispatch:

jobs:
  wheel:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # The bundle links against the build machine's glibc (2.35 on 22.04).
          - os: ubuntu-22.04
            plat-name: manylinux_2_35_x86_64
          - os: macos-15
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instantiate QULES
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build native bundle
        run: julia --startup-file=no --project=build build/build_library.jl

      - name: Build wheel
        run: |
          args=()
          if [ -n "${{ matrix.plat-name }}" ]; then args=(--plat-name "${{ matrix.plat-name }}"); fi
          python bindings/python/build_wheel.py "${args[@]}"

      - name: Install wheel
        run: python -m pip install bindings/python/dist/qules-*.whl

      - name: Test
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/bindings/python/tests/test_qules.py"

      - name: Stress test
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/bindings/python/tests/test_stress.py"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/qules-*.whl
