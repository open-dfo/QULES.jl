name: MATLAB probe

# MATLAB port: load the QULES bundle (taken from the pyqules 0.1.7 wheel) into
# MATLAB on every platform and run bindings/matlab/tests (test_qules and
# test_stress), then check the package still works after `clear all`.
on:
  workflow_dispatch:
  push:
    branches: [multiplatform]
    paths:
      - .github/workflows/matlab-probe.yml
      - .github/scripts/matlab_probe.*
      - bindings/matlab/**

jobs:
  probe:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bundle from the pyqules wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/pq" pyqules==0.1.7
          bundle="$RUNNER_TEMP/pq/pyqules/_bundle"
          PYTHONPATH="$RUNNER_TEMP/pq" python -c \
            "import sys; from pyqules import _native; _native.restore_symlinks(sys.argv[1])" "$bundle"
          echo "QULES_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a

      - name: Tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('.github/scripts'); matlab_probe(getenv('QULES_BUNDLE'));
            clear all;
            r = qules.optimize(@(x) (x(1) - 1)^2 + 10 * (x(2) + 2)^2, [3; 1], 'max_evals', 40);
            assert(r.f_best < 1e-12, 'after clear all: f_best = %g', r.f_best);
            disp('PASS  clear all: optimizer still works')

      - name: Crash dumps
        if: always()
        run: |
          for f in "$HOME"/matlab_crash_dump.*; do
            [ -e "$f" ] || continue
            echo "=== $f"; head -n 120 "$f"
          done
