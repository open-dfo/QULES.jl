name: MATLAB packages

# Package the existing QULES native bundles with the MATLAB loader as one .mltbx
# toolbox per platform, then install and test each toolbox in a fresh MATLAB
# process. A matlab-v* tag attaches the toolboxes to its GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [multiplatform]
    tags: ["matlab-v*"]   # path filters are not evaluated for tags
    paths:
      - .github/workflows/matlab-probe.yml
      - .github/scripts/matlab_*
      - bindings/matlab/**

env:
  QULES_RELEASE: "0.1.7"

jobs:
  probe:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage the existing native bundle and MATLAB files
        run: |
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp=$(cygpath -m "$runner_temp")
          fi
          package="$runner_temp/qules-matlab"
          bundle="$package/libqules"
          downloads="$runner_temp/qules-wheel"
          mkdir -p "$package" "$downloads"
          cp -R bindings/matlab/+qules "$package/"
          cp bindings/matlab/README.md "$package/"
          if [[ "$RUNNER_OS" != Windows ]]; then
            rm "$package/+qules/private/qules_thunk_pcwin64.dll" "$package/+qules/private/qules_proto.m"
          fi
          python -m pip download --no-deps --only-binary=:all: --dest "$downloads" "pyqules==$QULES_RELEASE"
          python - "$downloads" "$bundle" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          downloads, bundle = map(Path, sys.argv[1:])
          wheel, = downloads.glob("*.whl")
          prefix = "pyqules/_bundle/"
          with ZipFile(wheel) as archive:
              for entry in archive.infolist():
                  name = entry.filename
                  if not name.startswith(prefix) or name.endswith("/"):
                      continue
                  destination = bundle / name.removeprefix(prefix)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, destination.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  mode = (entry.external_attr >> 16) & 0o777
                  if os.name != "nt" and mode:
                      destination.chmod(mode)
          manifest = bundle / "symlinks.txt"
          if manifest.is_file():
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  link, target = line.split("\t")
                  (bundle / link).symlink_to(target)
          PY
          echo "QULES_MATLAB_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "QULES_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a

      - name: Generate the MATLAB prototype and thunk
        if: runner.os != 'Windows'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('.github/scripts'); matlab_package_prototype(getenv('QULES_BUNDLE'));

      - name: Package the toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('.github/scripts');
            matlab_package_toolbox(getenv('QULES_MATLAB_PACKAGE'),
            fullfile(pwd, 'qules-matlab-${{ matrix.platform }}.mltbx'), getenv('QULES_RELEASE'));

      - name: Install and test the toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('.github/scripts'); matlab_toolbox_test(fullfile(pwd, 'qules-matlab-${{ matrix.platform }}.mltbx'));
            clear all;
            r = qules.optimize(@(x) (x(1) - 1)^2 + 10 * (x(2) + 2)^2, [3; 1], 'max_evals', 40);
            assert(r.f_best < 1e-12, 'after clear all: f_best = %g', r.f_best);
            disp('PASS  clear all: optimizer still works')

      - uses: actions/upload-artifact@v4
        with:
          name: qules-matlab-${{ matrix.platform }}
          path: qules-matlab-${{ matrix.platform }}.mltbx
          compression-level: 0
          if-no-files-found: error

      - name: Crash dumps
        if: always()
        run: |
          for f in "$HOME"/matlab_crash_dump.*; do
            [ -e "$f" ] || continue
            echo "=== $f"; head -n 120 "$f"
          done

  release:
    needs: probe
    if: startsWith(github.ref, 'refs/tags/matlab-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qules-matlab-*
          merge-multiple: true
      - name: Attach the toolboxes to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "QULES for MATLAB ${TAG#matlab-v}" --notes "MATLAB toolboxes built from the pyqules $QULES_RELEASE native bundles."
          gh release upload "$TAG" qules-matlab-*.mltbx --repo "$GITHUB_REPOSITORY" --clobber
