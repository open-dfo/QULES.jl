name: MATLAB packages

# Package the existing QULES native bundles with the MATLAB loader, then test
# the staged packages in fresh MATLAB processes.
on:
  workflow_dispatch:
  push:
    branches: [multiplatform]
    paths:
      - .github/workflows/matlab-probe.yml
      - .github/scripts/matlab_probe.*
      - .github/scripts/matlab_package_prototype.m
      - bindings/matlab/**

jobs:
  probe:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage the existing native bundle and MATLAB files
        env:
          QULES_RELEASE: "0.1.7"
        run: |
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp=$(cygpath -m "$runner_temp")
          fi
          package="$runner_temp/qules-matlab"
          bundle="$package/libqules"
          downloads="$runner_temp/qules-wheel"
          mkdir -p "$package" "$downloads"
          cp -R bindings/matlab/+qules "$package/"
          cp bindings/matlab/README.md "$package/"
          if [[ "$RUNNER_OS" != Windows ]]; then
            rm "$package/+qules/private/qules_thunk_pcwin64.dll" "$package/+qules/private/qules_proto.m"
          fi
          python -m pip download --no-deps --only-binary=:all: --dest "$downloads" "pyqules==$QULES_RELEASE"
          python - "$downloads" "$bundle" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          downloads, bundle = map(Path, sys.argv[1:])
          wheel, = downloads.glob("*.whl")
          prefix = "pyqules/_bundle/"
          with ZipFile(wheel) as archive:
              for entry in archive.infolist():
                  name = entry.filename
                  if not name.startswith(prefix) or name.endswith("/"):
                      continue
                  destination = bundle / name.removeprefix(prefix)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, destination.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  mode = (entry.external_attr >> 16) & 0o777
                  if os.name != "nt" and mode:
                      destination.chmod(mode)
          manifest = bundle / "symlinks.txt"
          if manifest.is_file():
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  link, target = line.split("\t")
                  (bundle / link).symlink_to(target)
          PY
          echo "QULES_MATLAB_PACKAGE=$package" >> "$GITHUB_ENV"
          echo "QULES_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a

      - name: Generate the MATLAB prototype and thunk
        if: runner.os != 'Windows'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('.github/scripts'); matlab_package_prototype(getenv('QULES_BUNDLE'));

      - name: Archive and extract the MATLAB package
        run: |
          archive="$PWD/qules-matlab-${{ matrix.platform }}.tar.gz"
          test_dir="${QULES_MATLAB_PACKAGE}-test"
          (cd "$QULES_MATLAB_PACKAGE" && tar -czf "$archive" .)
          mkdir -p "$test_dir"
          (cd "$test_dir" && tar -xzf "$archive")
          echo "QULES_BUNDLE=$test_dir/libqules" >> "$GITHUB_ENV"

      - name: Tests
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath('.github/scripts'); matlab_probe(getenv('QULES_BUNDLE'));
            clear all;
            r = qules.optimize(@(x) (x(1) - 1)^2 + 10 * (x(2) + 2)^2, [3; 1], 'max_evals', 40);
            assert(r.f_best < 1e-12, 'after clear all: f_best = %g', r.f_best);
            disp('PASS  clear all: optimizer still works')

      - uses: actions/upload-artifact@v4
        with:
          name: qules-matlab-${{ matrix.platform }}
          path: qules-matlab-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

      - name: Crash dumps
        if: always()
        run: |
          for f in "$HOME"/matlab_crash_dump.*; do
            [ -e "$f" ] || continue
            echo "=== $f"; head -n 120 "$f"
          done
